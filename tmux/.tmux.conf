# Mehr Scrollback fuer Logs und Compiler-Ausgaben
set -g history-limit 10000

# Config neu laden: Ctrl+b, dann r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Windows ab 1 nummerieren
set -g base-index 1

# Pane-Nummern ebenfalls ab 1
setw -g pane-base-index 1

# Statusleiste unten
set -g status-position bottom
set -g status-interval 5

# Windows nummeriert und mit Namen anzeigen
set -g automatic-rename off
set -g window-status-format ' #I: #W '
set -g window-status-current-format ' [#I: #W] '

# VIM keybinds
set-window-option -g mode-keys vi

# RICING

# Statusleiste: Terminal-Farben verwenden
set -g status-justify left
set -g status-style 'fg=default,bg=default'

# Links keinen Session-Namen anzeigen
#set -g status-left ''
set -g status-right ''

# Inaktive Windows
setw -g window-status-style 'fg=default,bg=default'
setw -g window-status-format ' #I: #W '

# Aktives Window: dezent fett statt grell hinterlegt
setw -g window-status-current-style 'fg=black,bg=brightblue'
setw -g window-status-current-format ' #I: #W '

# Pane-Ränder ebenfalls dezent
set -g pane-border-style 'fg=default'
set -g pane-active-border-style 'fg=blue'
